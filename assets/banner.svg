<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t">
  <title id="t">Paywall Calculator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0034B0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <circle cx="1130" cy="-30" r="150" fill="#fff" opacity="0.06"/>
  <text x="70" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#fff">Paywall Calculator</text>
  <text x="72" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cfe3ff">Want the result? Pick a plan first.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle">
    <rect x="750" y="60" width="80" height="80" rx="22" fill="#fff"/><text x="790" y="112" fill="#0A84FF">+</text>
    <rect x="850" y="60" width="80" height="80" rx="22" fill="#fff"/><text x="890" y="112" fill="#0A84FF">&#8722;</text>
    <rect x="950" y="60" width="80" height="80" rx="22" fill="#fff" opacity="0.35"/><text x="990" y="112" fill="#fff">&#215;</text>
    <rect x="1050" y="60" width="80" height="80" rx="22" fill="#fff" opacity="0.35"/><text x="1090" y="112" fill="#fff">&#247;</text>
  </g>
</svg>

