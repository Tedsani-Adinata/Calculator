<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Paywall Calculator</title>
  <desc id="d">Banner kalkulator dengan tombol perkalian dan pembagian terkunci</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0040C8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001a5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="1120" cy="-20" r="220" fill="#fff" opacity="0.06"/>
  <circle cx="60" cy="440" r="180" fill="#fff" opacity="0.06"/>

  <text x="80" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#fff">Paywall</text>
  <text x="80" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#fff">Calculator</text>
  <text x="82" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cfe3ff">Mau hasilnya? Pilih paket dulu.</text>

  <g filter="url(#sh)">
    <rect x="780" y="50" width="330" height="300" rx="28" fill="#F2F2F7"/>
    <rect x="800" y="70" width="290" height="62" rx="14" fill="#fff"/>
    <text x="1074" y="116" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#1C1C1E">12 + 30</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">
      <rect x="800" y="150" width="62" height="62" rx="16" fill="#fff"/><text x="831" y="192" fill="#1C1C1E">7</text>
      <rect x="872" y="150" width="62" height="62" rx="16" fill="#fff"/><text x="903" y="192" fill="#1C1C1E">8</text>
      <rect x="944" y="150" width="62" height="62" rx="16" fill="#D6E8FF"/><text x="975" y="192" fill="#0A84FF">+</text>
      <rect x="1016" y="150" width="62" height="62" rx="16" fill="#D6E8FF"/><text x="1047" y="192" fill="#0A84FF">&#8722;</text>
      <rect x="800" y="222" width="62" height="62" rx="16" fill="#fff"/><text x="831" y="264" fill="#1C1C1E">4</text>
      <rect x="872" y="222" width="62" height="62" rx="16" fill="#fff"/><text x="903" y="264" fill="#1C1C1E">5</text>
      <rect x="944" y="222" width="62" height="62" rx="16" fill="#E5E5EA"/><text x="975" y="264" fill="#8E8E93">&#215;</text>
      <rect x="1016" y="222" width="62" height="62" rx="16" fill="#E5E5EA"/><text x="1047" y="264" fill="#8E8E93">&#247;</text>
    </g>
    <g fill="#8E8E93">
      <rect x="988" y="230" width="14" height="11" rx="2"/>
      <rect x="1060" y="230" width="14" height="11" rx="2"/>
    </g>
    <g fill="none" stroke="#8E8E93" stroke-width="2">
      <path d="M991 230 v-3 a4 4 0 0 1 8 0 v3"/>
      <path d="M1063 230 v-3 a4 4 0 0 1 8 0 v3"/>
    </g>
    <rect x="800" y="294" width="62" height="42" rx="14" fill="#007AFF"/>
    <text x="831" y="324" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#fff">=</text>
  </g>
</svg>


